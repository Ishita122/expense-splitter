name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint with ruff
        run: ruff check app || true

      - name: Type check (optional, non-blocking)
        run: python -m compileall app

      - name: Run tests
        run: pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t expense-splitter:ci ./backend

      - name: Smoke test container
        run: |
          docker run -d --name es -p 8000:8000 expense-splitter:ci
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs es && exit 1)
          docker stop es
